<!-- biome-ignore-all lint/a11y/noLabelWithoutControl: ignore -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HisaabSathi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=delete,download,settings,visibility,visibility_off">
<link rel="stylesheet" href="sidepanel.css"></head><body>
<header>
  <div class="brand">
    <img class="brand-logo" src="assets-logo.png" alt="HisaabSathi">
    <span class="brand-divider"></span>
    <img id="courierLogo" class="courier-logo" alt="" hidden>
    <span id="courierBadge" class="courier-badge" hidden></span>
  </div>
  <div class="header-actions">
    <label class="switch" for="enabled"><input id="enabled" type="checkbox"><span></span></label>
  </div>
</header>

<main>
  <div class="sheet-head">
    <div class="title">orders</div>
  </div>
  <div class="sheet-wrap"><table id="sheet"><thead></thead><tbody></tbody></table></div>
</main>

<footer>
  <div class="download-row">
    <select id="channelFilter" aria-label="service channel">
      <option value="ALL">all</option>
      <option value="EKART">ekart</option>
      <option value="SHREE MARUTI">shree maruti</option>
    </select>
    <button type="button" id="testSubmit" class="ghost" title="TEST ONLY — finalises the current live row without booking a real shipment">test create shipment</button>
    <button type="button" id="download" class="primary">download excel <span class="material-symbols-outlined" aria-hidden="true">download</span></button>
  </div>
</footer>

<div class="corner-actions">
  <button type="button" id="settings" class="settings-btn" title="Settings" aria-label="settings">
    <span class="material-symbols-outlined" aria-hidden="true">settings</span>
  </button>
  <button type="button" id="clear" class="secondary">delete <span class="material-symbols-outlined" aria-hidden="true">delete</span></button>
</div>

<div id="toast"></div>

<div id="confirmDialog" class="confirm-dialog" hidden>
  <div class="confirm-backdrop" data-confirm-cancel></div>
  <div class="confirm-panel" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div id="confirmTitle" class="confirm-title"></div>
    <p id="confirmMessage" class="confirm-message"></p>
    <div class="confirm-actions">
      <button type="button" id="confirmCancel" class="secondary">cancel</button>
      <button type="button" id="confirmOk" class="confirm-danger">delete</button>
    </div>
  </div>
</div>

<div id="settingsDialog" class="settings-dialog" hidden>
  <div class="settings-backdrop" data-settings-close></div>
  <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div id="settingsTitle" class="settings-title">settings</div>
    <label class="settings-label" for="apiTokenInput">Api Token</label>
    <div class="settings-field">
      <input id="apiTokenInput" type="password" placeholder="paste X-Api-Key (sk-hs-…)" autocomplete="off" spellcheck="false">
      <button type="button" id="apiTokenToggle" class="settings-toggle" title="Show API token" aria-label="show api token">
        <span class="material-symbols-outlined" aria-hidden="true">visibility</span>
      </button>
    </div>
    <div class="settings-actions">
      <button type="button" id="settingsCancel" class="secondary">cancel</button>
      <button type="button" id="settingsSave" class="primary">save</button>
    </div>
  </div>
</div>

<script src="sidepanel.js"></script></body></html>
