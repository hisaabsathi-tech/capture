<!-- biome-ignore-all lint/a11y/noLabelWithoutControl: ignore -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HisaabSathi</title><link rel="stylesheet" href="sidepanel.css"></head><body>
<header>
  <div class="brand">
    <img class="brand-logo" src="assets-logo.png" alt="HisaabSathi">
    <span class="brand-divider"></span>
    <img id="courierLogo" class="courier-logo" alt="" hidden>
    <span id="courierBadge" class="courier-badge" hidden></span>
  </div>
  <div class="header-actions">
    <label class="switch" for="enabled"><input id="enabled" type="checkbox"><span></span></label>
  </div>
</header>

<main>
  <div class="sheet-head">
    <div class="title">orders</div>
  </div>
  <div class="sheet-wrap"><table id="sheet"><thead></thead><tbody></tbody></table></div>
</main>

<footer>
  <div class="download-row">
    <select id="channelFilter" aria-label="service channel">
      <option value="ALL">all</option>
      <option value="EKART">ekart</option>
      <option value="SHREE MARUTI">shree maruti</option>
    </select>
    <button type="button" id="testSubmit" class="ghost" title="TEST ONLY — finalises the current live row without booking a real shipment">test create shipment</button>
    <button type="button" id="download" class="primary">download excel</button>
    <button type="button" id="clear" class="secondary">delete</button>
  </div>
</footer>

<div id="toast"></div>
<script src="sidepanel.js"></script></body></html>
